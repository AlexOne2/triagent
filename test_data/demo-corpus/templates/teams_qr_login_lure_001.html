<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Teams Mobile Access</title>
</head>
<body bgcolor="#f3f6fb" style="margin:0;background:#f3f6fb;font-family:Segoe UI,Arial,sans-serif;color:#252423;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" style="padding:28px;">
        <table width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="border:1px solid #d5dce8;">
          <tr>
            <td style="padding:18px 24px;background:#464eb8;color:#ffffff;font-size:19px;font-weight:600;">Microsoft Teams</td>
          </tr>
          <tr>
            <td style="padding:24px;font-size:14px;line-height:22px;">
              Your Teams mobile session expires tonight. Scan the attached code from your mobile device or use the fallback link below to keep chat and calling enabled.
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 24px 20px 24px;">
              <table cellpadding="0" cellspacing="0" border="0" width="220" style="border:1px dashed #98a2b3;background:#f8fafc;">
                <tr>
                  <td align="center" style="padding:28px;font-size:13px;color:#667085;">QR image attached<br>teams-mobile-access.png</td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px 26px 24px;">
              <a href="https://teams-access.example/mobile/scan" style="background:#464eb8;color:#ffffff;text-decoration:none;padding:11px 18px;display:inline-block;font-weight:600;">Continue device enrollment</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
