<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F3EA"/>
      <stop offset="0.55" stop-color="#FBFCFA"/>
      <stop offset="1" stop-color="#EEF5F4"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FAFCFB"/>
    </linearGradient>
    <filter id="shadow" x="-40" y="-40" width="1280" height="840" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#2A5C88"/>
    </marker>
    <style>
      .title { font: 700 40px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1F2937; }
      .subtitle { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #516173; }
      .section { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F766E; letter-spacing: 0.12em; }
      .panel-title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1F2937; }
      .panel-body { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5B6B7C; }
      .chip { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0F766E; }
      .flow { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2A5C88; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>

  <text x="62" y="84" class="title">Triagent Architecture</text>
  <text x="62" y="116" class="subtitle">On-prem phishing triage with a Next.js analyst workspace, FastAPI backend, and local object storage.</text>

  <g filter="url(#shadow)">
    <rect x="58" y="160" width="260" height="190" rx="24" fill="url(#panel)" stroke="#D7E1DE"/>
    <text x="86" y="198" class="section">ENTRY POINTS</text>
    <text x="86" y="236" class="panel-title">Analyst Browser</text>
    <text x="86" y="266" class="panel-body">Next.js / React workspace</text>
    <text x="86" y="295" class="panel-body">Dashboard, uploads, report detail,</text>
    <text x="86" y="320" class="panel-body">admin and audit pages</text>
    <rect x="86" y="338" width="116" height="32" rx="16" fill="#E8F6F2"/>
    <text x="110" y="359" class="chip">HTTP UI</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="58" y="392" width="260" height="168" rx="24" fill="url(#panel)" stroke="#D7E1DE"/>
    <text x="86" y="430" class="section">INGESTION</text>
    <text x="86" y="468" class="panel-title">Outlook Add-in</text>
    <text x="86" y="498" class="panel-body">Office.js taskpane add-in</text>
    <text x="86" y="527" class="panel-body">Reports suspicious messages</text>
    <text x="86" y="552" class="panel-body">as raw .msg / .eml files</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="372" y="160" width="458" height="400" rx="28" fill="url(#panel)" stroke="#CFE0DC"/>
    <text x="402" y="198" class="section">APPLICATION CORE</text>
    <text x="402" y="238" class="panel-title">FastAPI Backend</text>
    <text x="402" y="268" class="panel-body">Session auth, RBAC, report APIs, admin APIs, evidence export</text>

    <rect x="402" y="296" width="398" height="86" rx="18" fill="#F5FAF8" stroke="#D7E1DE"/>
    <text x="426" y="325" class="small">Ingestion and parsing</text>
    <text x="426" y="351" class="panel-body">.eml parser, extract-msg, header normalization, URL extraction, attachment hashing</text>

    <rect x="402" y="398" width="190" height="128" rx="18" fill="#F8FBFF" stroke="#D6E0EE"/>
    <text x="426" y="427" class="small">Analysis services</text>
    <text x="426" y="454" class="panel-body">SPF / DKIM / DMARC</text>
    <text x="426" y="479" class="panel-body">DNS enrichment</text>
    <text x="426" y="504" class="panel-body">Transmission parsing</text>

    <rect x="610" y="398" width="190" height="128" rx="18" fill="#F8FBFF" stroke="#D6E0EE"/>
    <text x="634" y="427" class="small">Analyst workflow</text>
    <text x="634" y="454" class="panel-body">Resolve / reopen</text>
    <text x="634" y="479" class="panel-body">Flagged artifacts</text>
    <text x="634" y="504" class="panel-body">Audit history</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="882" y="160" width="258" height="184" rx="24" fill="url(#panel)" stroke="#D7E1DE"/>
    <text x="910" y="198" class="section">PERSISTENCE</text>
    <text x="910" y="236" class="panel-title">PostgreSQL</text>
    <text x="910" y="266" class="panel-body">Reports, users, roles,</text>
    <text x="910" y="291" class="panel-body">attachments metadata,</text>
    <text x="910" y="316" class="panel-body">resolutions and audit events</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="882" y="376" width="258" height="184" rx="24" fill="url(#panel)" stroke="#D7E1DE"/>
    <text x="910" y="414" class="section">OBJECT STORAGE</text>
    <text x="910" y="452" class="panel-title">MinIO</text>
    <text x="910" y="482" class="panel-body">Attachment blobs, evidence</text>
    <text x="910" y="507" class="panel-body">artifacts and downloadable</text>
    <text x="910" y="532" class="panel-body">report assets</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="58" y="608" width="1082" height="94" rx="24" fill="url(#panel)" stroke="#D7E1DE"/>
    <text x="86" y="646" class="section">LOCAL DEPLOYMENT</text>
    <text x="86" y="678" class="panel-body">Docker Compose orchestrates the frontend, backend, PostgreSQL, and MinIO for local on-prem style development and demo environments.</text>
  </g>

  <path d="M320 255H360" stroke="#2A5C88" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M320 468H360" stroke="#2A5C88" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M832 252H872" stroke="#2A5C88" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M832 468H872" stroke="#2A5C88" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <text x="332" y="244" class="flow">UI queries and analyst actions</text>
  <text x="332" y="457" class="flow">Raw email submission</text>
  <text x="838" y="241" class="flow">Structured metadata</text>
  <text x="838" y="457" class="flow">Blob storage</text>

  <circle cx="370" cy="255" r="6" fill="#2A5C88"/>
  <circle cx="370" cy="468" r="6" fill="#2A5C88"/>
  <circle cx="872" cy="252" r="6" fill="#2A5C88"/>
  <circle cx="872" cy="468" r="6" fill="#2A5C88"/>
</svg>
