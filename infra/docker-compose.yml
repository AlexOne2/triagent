services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mailtriage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mailtriage}
      POSTGRES_DB: ${POSTGRES_DB:-mailtriage}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build:
      context: ../backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://mailtriage:mailtriage@postgres:5432/mailtriage}
      ADMIN_USERNAME: ${ADMIN_USERNAME-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD-}
      REPORTER_HASH_SALT: ${REPORTER_HASH_SALT:-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-mailtriage}
    depends_on:
      - postgres
      - minio
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
      NEXT_PUBLIC_API_USERNAME: ${NEXT_PUBLIC_API_USERNAME-}
      NEXT_PUBLIC_API_PASSWORD: ${NEXT_PUBLIC_API_PASSWORD-}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  minio_data:
