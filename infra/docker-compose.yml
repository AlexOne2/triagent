services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-triagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-triagent}
      POSTGRES_DB: ${POSTGRES_DB:-triagent}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build:
      context: ../backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://triagent:triagent@postgres:5432/triagent}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      REPORTER_HASH_SALT: ${REPORTER_HASH_SALT:-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AUTH_MODE: ${AUTH_MODE:-session_rbac}
      AUTH_SESSION_TTL_MINUTES: ${AUTH_SESSION_TTL_MINUTES:-480}
      AUTH_LEGACY_BASIC_ENABLED: ${AUTH_LEGACY_BASIC_ENABLED:-true}
      AUTH_PASSWORD_MIN_LENGTH: ${AUTH_PASSWORD_MIN_LENGTH:-14}
      AUTH_LOCKOUT_THRESHOLD: ${AUTH_LOCKOUT_THRESHOLD:-5}
      AUTH_LOCKOUT_WINDOW_MINUTES: ${AUTH_LOCKOUT_WINDOW_MINUTES:-15}
      AUTH_LOCKOUT_DURATION_MINUTES: ${AUTH_LOCKOUT_DURATION_MINUTES:-15}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-395}
      AUDIT_EXPORT_ENABLED: ${AUDIT_EXPORT_ENABLED:-true}
      AUDIT_EXPORT_STORAGE: ${AUDIT_EXPORT_STORAGE:-filesystem}
      AUDIT_EXPORT_BUCKET: ${AUDIT_EXPORT_BUCKET:-triagent-audit}
      AUDIT_EXPORT_PATH: ${AUDIT_EXPORT_PATH:-/tmp/triagent-audit}
      AUDIT_MAX_METADATA_BYTES: ${AUDIT_MAX_METADATA_BYTES:-8192}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-triagent}
    depends_on:
      - postgres
      - minio
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ../frontend
    environment:
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  pgdata:
  minio_data:
